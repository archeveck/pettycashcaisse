name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # La construction est gérée par l'action samuelmeuli/action-electron-builder
      # au-dessous, donc on n'a pas besoin de run build manuellement ici
      # sauf si on veut faire des tests spécifiques.
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Pour Windows/Mac code signing (si configuré)
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Publish to GitHub Releases
        uses: samuelmeuli/action-electron-builder@v1
        with:
          github_token: ${{ secrets.github_token }}
          release: true
          build_script_name: build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
